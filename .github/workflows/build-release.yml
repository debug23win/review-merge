name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build portable application
        shell: pwsh
        run: |
          $version = '1.2.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          ./build.ps1 -Version $version
      - name: Test merging and update validation
        shell: pwsh
        run: |
          python -m pip install openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
          python tests/test_merge.py
          if ($LASTEXITCODE -ne 0) { throw 'Merge tests failed' }
          ./tests/test_updates.ps1
      - name: Publish portable package
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $appVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $PWD 'Свод_проверки.exe')).FileVersion
            $tag = 'v' + ([version]$appVersion).ToString(3)
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and $env:GITHUB_REF -eq 'refs/heads/main') { exit 0 }
          if (!$exists) {
            gh release create $tag --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY --title $tag --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag dist/review-merge-windows.zip dist/review-merge-windows.zip.sha256 --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
